name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues must be reported privately** (see SECURITY.md), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: environment
    attributes:
      label: Where did it happen?
      options:
        - docker compose (local)
        - pnpm dev (local)
        - Self-hosted deployment
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove personal data, tokens and secrets before pasting.
      render: shell

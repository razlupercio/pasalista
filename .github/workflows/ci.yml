# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pasalista
          POSTGRES_PASSWORD: pasalista
          POSTGRES_DB: pasalista
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pasalista -d pasalista"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pasalista:pasalista@localhost:5432/pasalista_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated files are up to date
        run: |
          pnpm openapi:generate
          pnpm db:generate
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.d.ts packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"

  e2e:
    name: End-to-end (Docker Compose)
    runs-on: ubuntu-latest
    needs: quality
    env:
      # Playwright simulates distinct clients through X-Forwarded-For (see apps/web/e2e).
      TRUSTED_PROXY_HOPS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up --build --detach --wait
      - run: pnpm --filter @pasalista/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        run: docker compose logs api web
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - if: always()
        run: docker compose down --volumes
